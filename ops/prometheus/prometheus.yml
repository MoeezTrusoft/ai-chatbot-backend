global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/pricing-alerts.yml

scrape_configs:
  - job_name: bookcraft-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # Sales is the other half of the funnel (S9.2.1): `sales_chatbot_*` counters are
  # published on Sales' own /metrics, so one Prometheus carries both sides.
  - job_name: sales-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3008"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
