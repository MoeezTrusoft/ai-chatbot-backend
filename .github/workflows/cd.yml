name: Build and validate image
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: bookcraft:validated
      - name: Smoke test
        run: |
          docker run -d --name bookcraft-smoke -p 127.0.0.1:8000:8000 -e APP_ENV=test bookcraft:validated
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/healthz
          curl --fail http://127.0.0.1:8000/readyz
          docker exec bookcraft-smoke python -c "import os; assert os.getuid() != 0"
          docker exec bookcraft-smoke alembic heads
      - name: Export validated image
        run: docker save bookcraft:validated | gzip > bookcraft-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bookcraft-image-${{ github.sha }}
          path: bookcraft-image.tar.gz
          retention-days: 7
      - name: Container logs
        if: always()
        run: docker logs bookcraft-smoke || true
      - name: Cleanup
        if: always()
        run: docker rm -f bookcraft-smoke || true
